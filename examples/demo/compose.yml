name: lakeducktor-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-only
      POSTGRES_DB: demo
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - metadata:/var/lib/postgresql/data

  prepare-lake:
    image: alpine:3.22
    command: [chown, "10001:10001", /lake]
    volumes:
      - lake:/lake

  demo:
    build:
      context: ../..
    image: lakeducktor:demo
    depends_on:
      postgres:
        condition: service_healthy
      prepare-lake:
        condition: service_completed_successfully
    entrypoint: [python, /demo/demo.py]
    environment:
      METADATA_DATABASE: postgres
      METADATA_DATABASE_HOST: postgres
      METADATA_DATABASE_PORT: "5432"
      METADATA_DATABASE_USERNAME: demo
      METADATA_DATABASE_PASSWORD: demo-only
      METADATA_DATABASE_NAME: demo
      METADATA_DATABASE_SCHEMA: ducklake
      MAINTAIN_LAKES: ducklake
      CATALOG_STORAGE: filesystem
      CATALOG_DATA_PATH: /home/lakeducktor/demo-lake/
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY: 1GB
      ORPHAN_CLEANUP_ENABLED: "false"
    volumes:
      - ./demo.py:/demo/demo.py:ro
      - lake:/home/lakeducktor/demo-lake

volumes:
  metadata:
  lake:
