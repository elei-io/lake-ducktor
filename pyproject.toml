[project]
name = "lakeducktor"
version = "0.1.0"
description = "Automatic physical maintenance for DuckLake"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb==1.5.5",
    "prometheus-client>=0.25,<1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
lakeducktor = "lakeducktor.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
